spring.application.name=ExpenseTracker


#MySql Configuration
spring.datasource.url = jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:expense_tracker}
spring.datasource.username = ${MYSQL_USERNAME}
spring.datasource.password = ${MYSQL_PASSWORD}

server.servlet.context-path = /api/v1.0


#JPA Configuration
spring.jpa.hibernate.ddl-auto = none
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true


##Email Configuration
spring.mail.host = ${EMAIL_HOST}
spring.mail.port = ${EMAIL_PORT}
spring.mail.username = ${GMAIL_USERNAME}
spring.mail.password = ${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth = true
spring.mail.properties.mail.smtp.starttls.enable = true
spring.mail.protocol = smtp


springdoc.swagger-ui.path= /docs


jwt.secretKey = ${JWT_SECRETKEY}

# Public base URL for links in emails
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}